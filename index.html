<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="タスク">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>タスクリスト</title>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>タスク</h1>
      <div class="hdr-actions">
        <button id="sync-status" class="sync-pill" hidden></button>
        <button id="btn-search" class="icon-btn" aria-label="検索">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-menu" class="icon-btn" aria-label="メニュー">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div id="search-bar" class="search-bar" hidden>
      <input id="search-input" type="search" placeholder="タスク名・メモ・タグを検索" autocomplete="off">
      <button id="search-close" class="text-btn">閉じる</button>
    </div>

    <nav class="views" id="views" aria-label="表示切替"></nav>
    <div class="tag-filter" id="tag-filter"></div>

    <main>
      <div id="list" class="list"></div>
      <div id="empty" class="empty" hidden></div>
    </main>
  </div>

  <form id="quick-add" class="quick-add" autocomplete="off">
    <div class="quick-inner">
      <input id="quick-input" placeholder="タスクを追加（今日期限）  #タグ も可" enterkeyhint="done">
      <button type="submit" class="btn primary">追加</button>
      <button type="button" id="btn-detail-add" class="btn">詳細</button>
    </div>
  </form>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/vendor/supabase-2.118.0.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
